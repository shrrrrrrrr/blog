# 把 main 分支自动部署到 GitHub Pages。
name: Deploy static blog to GitHub Pages

on:
  # 每次推送 main 分支时自动部署。
  push:
    branches: ["main"]

  # 允许在 GitHub Actions 页面手动重新运行。
  workflow_dispatch:

# Pages 部署需要读取仓库、写入 Pages，并获取 OIDC 身份令牌。
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个部署，新的提交会取代仍在排队的旧部署。
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate source files
        run: npm run check

      - name: Build static website
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
